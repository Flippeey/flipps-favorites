name: PR Evidence

# Captures UI-evidence screenshots for PRs that touch tests/evidence/*.evidence.spec.ts
# and posts them as a single sticky comment. See:
#   /home/flippey/.claude/docs/plan/20260711-pr-evidence-and-wiki-capture/ws1-evidence-decision.md
# for the full design rationale (T1). This file implements that contract (T4).
#
# SECURITY (read before editing):
# - Event is `pull_request`, never `pull_request_target`. `pull_request_target` runs with
#   base-repo secrets/token even for fork PRs while checking out fork code - a "pwn request"
#   vector. We don't want that here since this workflow builds + executes the PR's own code.
# - Same-repo assumption: this repo (flipps-favorites) only receives same-repo PRs today.
#   The `head.repo.full_name == github.repository` guard below makes that assumption an
#   explicit, fail-closed condition rather than an implicit one - if a fork PR ever appears,
#   the evidence job is skipped outright instead of running with a downgraded (read-only)
#   token and failing midway through a push/comment step.
# - No `${{ }}` interpolation of ANY PR-controlled string (title, body, branch name, labels)
#   into a `run:` shell body anywhere in this file. The only values interpolated into `run:`
#   bodies are the PR number and commit SHAs, both GitHub-generated safe integers/hex - never
#   user-authored text - and even those go through `env:` + a numeric/hex regex guard rather
#   than direct `${{ }}` substitution inside the script text.
# - Evidence PNG filenames are generated by our own spec code (tests/evidence/output/), but
#   the sticky-comment step still lists them via Node's `fs.readdirSync` inside
#   actions/github-script, never by interpolating a shell-globbed file list into a script.
# - Permissions are the minimum needed: `contents: write` (push to the orphan pr-evidence
#   branch) and `pull-requests: write` (create/update the sticky comment). Nothing else.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run per PR at a time; a new push supersedes an in-flight evidence run for the same PR.
concurrency:
  group: pr-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  evidence:
    name: Capture + comment
    # Skip entirely for fork PRs (fail closed, not mid-workflow) and for the "closed" event
    # (handled by the cleanup job below, which needs no build/run steps).
    if: >
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the diff below can always resolve base/head SHAs, even for a
          # first push on a new branch.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Gate rule (decided here per T1's open question): an evidence-carrying PR is one whose
      # diff *changes* a tests/evidence/*.evidence.spec.ts file. Existence alone is not enough -
      # the repo always carries at least one committed example spec, so an existence check
      # would treat every PR as evidence-bearing. Diffing base..head SHAs is the simplest rule
      # that still says "no evidence for this PR" for ordinary non-UI changes.
      # Known limitation (flagged for T7): a PR that only edits a component already covered by
      # an *unchanged* evidence spec will be skipped too. Accepted for simplicity; revisit if
      # stale screenshots on unrelated UI PRs become a problem.
      - name: Detect changed evidence specs
        id: check_specs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "BASE_SHA not a sha"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "HEAD_SHA not a sha"; exit 1; }
          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'tests/evidence/*.evidence.spec.ts' || true)"
          if [ -n "$CHANGED" ]; then
            echo "has_spec=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_spec=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check_specs.outputs.has_spec == 'true'
        run: npm ci

      - name: Install Playwright browsers
        if: steps.check_specs.outputs.has_spec == 'true'
        run: npx playwright install --with-deps chromium

      # `npm run evidence` (package.json) already runs `build:chrome:test` itself before
      # invoking playwright, so no separate build step here - it forces chrome.storage.local
      # and never touches the dist/chrome release artifact, same as the rest of the suite.
      # Headed-in-xvfb mirrors test.yml's documented rationale for CI stability.
      - name: Run evidence specs
        if: steps.check_specs.outputs.has_spec == 'true'
        env:
          HEADED: '1'
        run: xvfb-run -a npm run evidence

      # Publish captured PNGs to the disposable orphan `pr-evidence` branch, under this PR's
      # own subdirectory. Never touches main or the PR branch. `git push` targets `pr-evidence`
      # explicitly (no wildcard/force against any other ref).
      - name: Publish evidence to orphan branch
        if: steps.check_specs.outputs.has_spec == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "PR_NUMBER not numeric"; exit 1; }

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          WORKTREE="$(mktemp -d)"
          if git ls-remote --exit-code --heads origin pr-evidence >/dev/null 2>&1; then
            git fetch origin pr-evidence
            git worktree add "$WORKTREE" pr-evidence
          else
            git worktree add --detach "$WORKTREE"
            git -C "$WORKTREE" checkout --orphan pr-evidence
            git -C "$WORKTREE" rm -rf . >/dev/null 2>&1 || true
          fi

          DEST="$WORKTREE/pr-$PR_NUMBER"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          if compgen -G "tests/evidence/output/*.png" > /dev/null; then
            cp tests/evidence/output/*.png "$DEST"/
          fi

          cd "$WORKTREE"
          git add "pr-$PR_NUMBER"
          if git diff --cached --quiet; then
            echo "No evidence changes to commit"
          else
            git commit -m "evidence: pr-$PR_NUMBER"
            git push origin HEAD:pr-evidence
          fi

      # Idempotent sticky comment, identified by the hidden marker. Runs whether or not the
      # PR carries evidence, so a re-run always converges to one up-to-date comment rather
      # than spamming a new one. File listing uses fs.readdirSync (no shell glob
      # interpolation) - filenames are spec-generated but still handled defensively.
      - name: Post/update sticky evidence comment
        if: always()
        uses: actions/github-script@v7
        env:
          HAS_SPEC: ${{ steps.check_specs.outputs.has_spec }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- ff-pr-evidence:do-not-edit -->';
            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            const hasSpec = process.env.HAS_SPEC === 'true';

            let body;
            if (!hasSpec) {
              body = [
                marker,
                '### PR Evidence',
                '',
                'No UI evidence spec changed on this PR ' +
                  '(`tests/evidence/*.evidence.spec.ts` unchanged in the diff) - skipped.',
              ].join('\n');
            } else {
              const outDir = path.join(process.env.GITHUB_WORKSPACE, 'tests/evidence/output');
              let files = [];
              try {
                files = fs.readdirSync(outDir).filter((f) => f.endsWith('.png')).sort();
              } catch {
                files = [];
              }

              if (files.length === 0) {
                body = [
                  marker,
                  '### PR Evidence',
                  '',
                  'Evidence spec ran but produced no screenshots.',
                ].join('\n');
              } else {
                const lines = [marker, '### PR Evidence', ''];
                for (const file of files) {
                  const base = file.replace(/\.png$/, '');
                  const sep = base.lastIndexOf('--');
                  const caption = sep === -1 ? base : base.slice(0, sep);
                  const label = sep === -1 ? '' : base.slice(sep + 2);
                  const url =
                    `https://raw.githubusercontent.com/${owner}/${repo}/pr-evidence/` +
                    `pr-${prNumber}/${file}`;
                  lines.push(`**${caption}**${label ? ` - ${label}` : ''}`);
                  lines.push('');
                  lines.push(`![${file}](${url})`);
                  lines.push('');
                }
                body = lines.join('\n');
              }
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup:
    name: Remove closed PR's evidence
    if: >
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Non-fatal by design: if the pr-evidence branch or this PR's subdir never existed
      # (no evidence spec ever ran for it), there's nothing to clean up - exit green.
      - name: Delete this PR's evidence subdir
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo "PR_NUMBER not numeric"; exit 1; }

          if ! git ls-remote --exit-code --heads origin pr-evidence >/dev/null 2>&1; then
            echo "pr-evidence branch does not exist - nothing to clean up"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          WORKTREE="$(mktemp -d)"
          git fetch origin pr-evidence
          git worktree add "$WORKTREE" pr-evidence

          DEST="$WORKTREE/pr-$PR_NUMBER"
          if [ ! -d "$DEST" ]; then
            echo "No evidence subdir for pr-$PR_NUMBER - nothing to clean up"
            exit 0
          fi

          cd "$WORKTREE"
          git rm -rf "pr-$PR_NUMBER" >/dev/null
          git commit -m "evidence: remove pr-$PR_NUMBER (closed)"
          git push origin HEAD:pr-evidence
