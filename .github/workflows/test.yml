name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    name: Build + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc is not exercised by build/test steps (vite/vitest/playwright all
      # transpile via esbuild/rolldown) — without this step a TS upgrade can
      # break typechecking while CI stays green (see PR #72).
      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build both targets
        run: npm run build

      # Chrome specs load this dedicated dist/chrome-test build, not dist/chrome
      # above — it forces chrome.storage.local (see vite.config.mjs,
      # tests/fixtures/launch.ts) so the sync-preferred flush race can't cause
      # the "persists after reload" flake. dist/chrome (the release artifact)
      # stays untouched.
      - name: Build Chrome test target
        run: npm run build:chrome:test

      # CI runs the same headless-new mode as local (tests/fixtures/launch.ts
      # defaults to --headless=new unless HEADED=1) so any CI failure is
      # reproducible locally without a display. A side-by-side run of 6
      # headed-in-xvfb jobs against 6 headless jobs showed equal reliability,
      # so xvfb no longer earns its extra moving part. Reporter config (github
      # + job-summary table + html) comes from playwright.config.ts, so don't
      # override it with a CLI --reporter flag.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Install Puppeteer Firefox
        if: ${{ !cancelled() }}
        run: npm run test:firefox:e2e:install-browser

      - name: Run Firefox E2E (Puppeteer)
        if: ${{ !cancelled() }}
        run: npm run test:firefox:e2e
