name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  playwright:
    name: Build + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build both targets
        run: npm run build

      # Run headed under a virtual display (xvfb). Chrome's new headless
      # (--headless=new, the LOCAL default — see tests/fixtures/extension-context.ts)
      # loads MV3 extensions fine, but in CI its tighter timing worsens the
      # documented sync-storage-race flake on "persists after reload" specs past
      # what retries:1 absorbs. Headed-in-xvfb is CI's stable path; HEADED=1
      # forces it. Locals stay headless to avoid stealing window focus.
      # Reporter config (github + job-summary table + html) comes from
      # playwright.config.ts — don't override it with a CLI --reporter flag.
      - name: Run Playwright tests
        env:
          HEADED: '1'
        run: xvfb-run -a npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Install Puppeteer Firefox
        if: ${{ !cancelled() }}
        run: npx puppeteer browsers install firefox

      - name: Run Firefox E2E (Puppeteer)
        if: ${{ !cancelled() }}
        run: npm run test:firefox:e2e
