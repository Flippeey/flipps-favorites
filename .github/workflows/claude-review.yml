name: Claude review

# Auto-reviews a PR when it's opened / marked ready, and responds to `@claude`
# mentions on demand. Runs on your Claude subscription via the
# CLAUDE_CODE_OAUTH_TOKEN secret (generate with `claude setup-token` and paste the
# printed sk-ant-oat01-… value). Requires the Claude GitHub App installed on the
# repo (github.com/apps/claude or `/install-github-app`).
#
# Fork PRs are skipped by design — GitHub withholds secrets from them — so this
# only runs on your own PRs, and review usage draws from your plan's limits.
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude:
    # Auto-review only same-repo PRs; for comments, only act on @claude mentions.
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # On PR open/ready → run the code-review skill. On @claude comments →
          # empty prompt lets the action auto-detect and respond to the mention.
          prompt: ${{ github.event_name == 'pull_request' && format('/code-review:code-review {0}/pull/{1}', github.repository, github.event.pull_request.number) || '' }}
          plugin_marketplaces: ${{ github.event_name == 'pull_request' && 'https://github.com/anthropics/claude-code.git' || '' }}
          plugins: ${{ github.event_name == 'pull_request' && 'code-review@claude-code-plugins' || '' }}
