name: Publish extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # A stale tag must not ship a mismatched build.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "Tag v$TAG != package.json $PKG"; exit 1; }

      - name: Zip packages
        run: |
          (cd dist/chrome  && zip -r ../../flipps-favorites-chrome.zip  .)
          (cd dist/firefox && zip -r ../../flipps-favorites-firefox.zip .)

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: flipps-favorites-*.zip

  chrome:
    needs: build
    # Secrets live in the prod environment; required-reviewer approval gates this job.
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: packages

      # CWS API v2 (v1.1 sunsets 2026-10-15). Requires CHROME_PUBLISHER_ID
      # (Developer Dashboard -> Account) alongside the existing OAuth secrets.
      # v2.0.1 tag ships no built index.cjs (upstream broken release); v2.0.0 is the last working CWS API v2 build.
      #
      # Upload and publish are split: upload MUST succeed (hard-fails the job), but
      # publish is best-effort. A store-side metadata block (INVALID_ITEM_METADATA)
      # then leaves a clean uploaded draft the maintainer can publish from the
      # dashboard, instead of red-X-ing the whole run after a successful upload.
      - name: Upload draft to Chrome Web Store
        uses: wdzeng/chrome-extension@25f21f518a470076a8fe40c817e20505cd1a81a7 # v2.0.1
        with:
          action: upload
          zip-path: flipps-favorites-chrome.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Publish Chrome Web Store draft
        id: cws_publish
        continue-on-error: true
        uses: wdzeng/chrome-extension@25f21f518a470076a8fe40c817e20505cd1a81a7 # v2.0.1
        with:
          action: publish
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Flag unpublished draft
        if: steps.cws_publish.outcome == 'failure'
        run: |
          echo "::warning title=Chrome draft not published::Draft uploaded but auto-publish was rejected (likely INVALID_ITEM_METADATA). Resolve listing metadata in the CWS Developer Dashboard, then publish there or re-run this job."

  firefox:
    needs: build
    environment: prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:firefox

      # AMO reviews bundled/minified code from source; reproducible via npm ci && npm run build:firefox.
      - name: Create source zip for AMO review
        run: git archive HEAD --format=zip -o flipps-favorites-source.zip

      # --approval-timeout 0: listed submissions are human-reviewed, so don't
      # poll for the signed XPI — succeed once upload + validation complete.
      #
      # AMO rejects a re-submit of an existing version ("Version X already exists").
      # That is a benign idempotent re-run, not a failure, so swallow only that case.
      - name: Sign & submit to AMO
        shell: bash
        run: |
          set -o pipefail
          if npx web-ext sign \
            --source-dir dist/firefox \
            --channel listed \
            --approval-timeout 0 \
            --upload-source-code flipps-favorites-source.zip \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" 2>&1 | tee sign.log; then
            exit 0
          fi
          if grep -q "already exists" sign.log; then
            echo "::warning title=AMO version already submitted::Version already exists on AMO; treating idempotent re-run as success."
            exit 0
          fi
          exit 1
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
